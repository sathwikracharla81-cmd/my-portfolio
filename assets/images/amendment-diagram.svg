<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gemmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Title Badge -->
  <rect x="40" y="30" width="720" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="66" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="1">AMENDMENT: SYSTEM ARCHITECTURE</text>
  <rect x="560" y="44" width="180" height="32" rx="16" fill="url(#headerGrad)"/>
  <text x="650" y="65" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1st Prize Gemma Track</text>

  <!-- Left: Client Layer -->
  <rect x="40" y="120" width="200" height="310" rx="12" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="120" width="200" height="42" rx="12" fill="#1e3a8a"/>
  <text x="140" y="146" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">FRONTEND / CLIENT</text>
  <text x="60" y="190" fill="#94a3b8" font-size="13">✦ Interactive Game Board</text>
  <text x="60" y="220" fill="#94a3b8" font-size="13">✦ Rule Proposal Input</text>
  <text x="60" y="250" fill="#94a3b8" font-size="13">✦ Live Game State Sync</text>
  <text x="60" y="280" fill="#94a3b8" font-size="13">✦ Dice &amp; Player Movement</text>
  <rect x="60" y="320" width="160" height="80" rx="8" fill="#090d16" stroke="#1e293b"/>
  <text x="75" y="348" fill="#38bdf8" font-size="11" font-family="monospace">POST /api/propose</text>
  <text x="75" y="375" fill="#a855f7" font-size="11" font-family="monospace">POST /api/step</text>

  <!-- Center: Deterministic Engine (Sathwik's Core Role) -->
  <rect x="290" y="110" width="220" height="330" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="290" y="110" width="220" height="42" rx="12" fill="#064e3b"/>
  <text x="400" y="136" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">DETERMINISTIC ENGINE</text>
  <rect x="310" y="160" width="180" height="26" rx="6" fill="#047857"/>
  <text x="400" y="177" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Sathwik's Core Backend</text>
  <text x="310" y="215" fill="#e2e8f0" font-size="12">⚙️ Fast-API Application Server</text>
  <text x="310" y="240" fill="#e2e8f0" font-size="12">🛡️ Rule Validation Pipeline</text>
  <text x="310" y="265" fill="#e2e8f0" font-size="12">🎲 Deterministic State Machine</text>
  <text x="310" y="290" fill="#e2e8f0" font-size="12">📜 Rulebook JSON Manager</text>
  <text x="310" y="315" fill="#e2e8f0" font-size="12">🔒 Immutable Rule Protections</text>
  <rect x="305" y="340" width="190" height="85" rx="8" fill="#022c22" stroke="#059669"/>
  <text x="315" y="362" fill="#a7f3d0" font-size="10" font-family="monospace">{"trigger": "on_land",</text>
  <text x="315" y="380" fill="#a7f3d0" font-size="10" font-family="monospace"> "effect": "add_score",</text>
  <text x="315" y="398" fill="#a7f3d0" font-size="10" font-family="monospace"> "amount": 2, "target": "self"}</text>

  <!-- Right: AI Court Layer -->
  <rect x="560" y="120" width="200" height="310" rx="12" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="2"/>
  <rect x="560" y="120" width="200" height="42" rx="12" fill="#581c87"/>
  <text x="660" y="146" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700">THE COURT (AI)</text>
  <text x="580" y="190" fill="#94a3b8" font-size="13">✦ Local Gemma via Ollama</text>
  <text x="580" y="220" fill="#94a3b8" font-size="13">✦ Natural Language Parsing</text>
  <text x="580" y="250" fill="#94a3b8" font-size="13">✦ Rule Synthesis Contract</text>
  <text x="580" y="280" fill="#94a3b8" font-size="13">✦ Strict Schema Output</text>
  <rect x="580" y="320" width="160" height="80" rx="8" fill="#090d16" stroke="#1e293b"/>
  <text x="595" y="352" fill="#f43f5e" font-size="11">English: "Land = +2 pts"</text>
  <text x="595" y="380" fill="#10b981" font-size="11">➔ Compiled Rule JSON</text>

  <!-- Connecting Arrows -->
  <path d="M 240 240 L 290 240" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="288,235 298,240 288,245" fill="#3b82f6"/>
  
  <path d="M 510 240 L 560 240" stroke="#a855f7" stroke-width="3" stroke-dasharray="5 5"/>
  <polygon points="558,235 568,240 558,245" fill="#a855f7"/>

  <!-- Footer label -->
  <text x="400" y="465" text-anchor="middle" fill="#64748b" font-size="12">Decoupled Architecture: The Court compiles plain English; the Deterministic Engine executes &amp; enforces state.</text>
</svg>
